name: Firebase Hosting Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: springboards-community-dev
  FIRESTORE_DATABASE_ID: main
  TZ: America/New_York

jobs:
  deploy:
    name: Build, Stage & Deploy Custom Code to Firebase Hosting
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPRINGBOARDS_COMMUNITY_DEV }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & verify custom JS/CSS syntax
        run: npm run lint

      - name: Run build & stamp custom code SHA-256 registry
        run: npm run build

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPRINGBOARDS_COMMUNITY_DEV }}

      - name: Deploy Custom Code to Firebase Hosting Staging Channel
        if: env.GOOGLE_APPLICATION_CREDENTIALS != '' || env.FIREBASE_TOKEN != ''
        run: |
          npx --yes firebase-tools@latest hosting:channel:deploy staging \
            --expires 30d \
            --project "$FIREBASE_PROJECT_ID"

      - name: Promote Verified Custom Code to Firebase Hosting Production & Firestore Rules
        if: github.event_name != 'pull_request' && (env.GOOGLE_APPLICATION_CREDENTIALS != '' || env.FIREBASE_TOKEN != '')
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting,firestore:rules \
            --project "$FIREBASE_PROJECT_ID"
