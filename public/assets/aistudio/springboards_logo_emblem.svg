<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 440" width="512" height="440" role="img" aria-label="Springboards for Community Development Emblem Icon">
  <title>Springboards for Community Development Emblem</title>
  <desc>Original company emblem featuring three leaping figures in Leaf Green, Deep Navy, and Golden Amber above a 3D navy springboard and coiled steel spring, flanked by neighborhood houses and an urban skyline inside a Deep Navy arch and Leaf Green horizon.</desc>
  <defs>
    <!-- Subtle inner clip for the circular arch -->
    <clipPath id="sbArchInnerClip">
      <circle cx="256" cy="232" r="196" />
    </clipPath>
  </defs>

  <!-- 1. LEFT COMMUNITY VIGNETTE: Leafy Tree & Two Neighborhood Houses -->
  <g id="left-community-vignette">
    <!-- Leafy Green Tree Crown (#538D22) -->
    <path d="M98 242 C82 242 72 230 74 216 C64 210 62 194 72 184 C68 170 80 156 96 158 C104 146 124 146 134 158 C148 156 160 168 156 184 C166 192 164 208 152 216 C154 230 142 242 126 242 Z" fill="#538D22" />
    <!-- Tree Trunk & Branches (#062B54 with white separation highlight) -->
    <path d="M112 272 L112 232 L96 216 M112 238 L128 220 M112 228 L114 210" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M112 274 L112 232 L98 218 M112 238 L126 222 M112 228 L114 212" stroke="#062B54" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Right/Rear Taller House (#062B54 & #FFFFFF) -->
    <polygon points="146,214 176,184 206,214 206,282 146,282" fill="#062B54" />
    <!-- Rear House White Wall Facade -->
    <polygon points="153,215 176,192 199,215 199,276 153,276" fill="#FFFFFF" />
    <!-- Rear House Roof Overhang -->
    <path d="M142 217 L176 183 L210 217" stroke="#062B54" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Rear House Attic Window & Upper/Lower Windows -->
    <rect x="172" y="199" width="8" height="8" fill="#062B54" />
    <!-- Upper 4-pane window -->
    <rect x="167" y="216" width="18" height="16" fill="#062B54" />
    <line x1="176" y1="216" x2="176" y2="232" stroke="#FFFFFF" stroke-width="2" />
    <line x1="167" y1="224" x2="185" y2="224" stroke="#FFFFFF" stroke-width="2" />
    <!-- Lower 4-pane window -->
    <rect x="167" y="242" width="18" height="18" fill="#062B54" />
    <line x1="176" y1="242" x2="176" y2="260" stroke="#FFFFFF" stroke-width="2" />
    <line x1="167" y1="251" x2="185" y2="251" stroke="#FFFFFF" stroke-width="2" />

    <!-- Left/Front Pitched-Roof House (#062B54, #FFFFFF, and Golden Amber Window #E69516) -->
    <!-- Chimney -->
    <rect x="131" y="198" width="8" height="18" fill="#062B54" />
    <!-- House Base Silhouette -->
    <polygon points="82,256 96,256 96,232 136,198 170,230 170,288 82,298" fill="#062B54" />
    <!-- Left Roof Slope Fill -->
    <polygon points="92,232 122,202 152,202 124,232" fill="#062B54" />
    <!-- White Front Gable Facade -->
    <polygon points="122,232 145,210 166,232 166,282 122,282" fill="#FFFFFF" />
    <!-- Crisp Roof Frame -->
    <path d="M116 235 L145 207 L172 234" stroke="#062B54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Door (Navy) -->
    <rect x="108" y="246" width="12" height="26" rx="1" fill="#FFFFFF" />
    <!-- Golden Amber Illuminated Window (#E69516) with Navy Muntins -->
    <rect x="135" y="240" width="18" height="18" fill="#E69516" stroke="#062B54" stroke-width="2.5" />
    <line x1="144" y1="240" x2="144" y2="258" stroke="#062B54" stroke-width="2.2" />
    <line x1="135" y1="249" x2="153" y2="249" stroke="#062B54" stroke-width="2.2" />
    <!-- Gable Vent -->
    <rect x="141" y="220" width="8" height="8" fill="#062B54" />
  </g>

  <!-- 2. RIGHT URBAN SKYLINE VIGNETTE: Three Multi-Story City Towers & Street Tree -->
  <g id="right-urban-vignette">
    <!-- Left Slanted-Roof High-Rise Tower (#062B54) -->
    <polygon points="318,162 342,146 364,162 364,278 318,278" fill="#062B54" />
    <!-- Left face angled window strips -->
    <g fill="#FFFFFF">
      <polygon points="323,166 338,156 338,163 323,173" />
      <polygon points="323,179 338,169 338,176 323,186" />
      <polygon points="323,192 338,182 338,189 323,199" />
      <polygon points="323,205 338,195 338,202 323,212" />
      <polygon points="323,218 338,208 338,215 323,225" />
      <polygon points="323,231 338,221 338,228 323,238" />
      <!-- Right face horizontal window bars -->
      <rect x="344" y="164" width="14" height="6" />
      <rect x="344" y="176" width="14" height="6" />
      <rect x="344" y="188" width="14" height="6" />
      <rect x="344" y="200" width="14" height="6" />
      <rect x="344" y="212" width="14" height="6" />
      <rect x="344" y="224" width="14" height="6" />
    </g>

    <!-- Center Tallest Skyscraper (#062B54) -->
    <polygon points="366,136 382,126 402,138 402,286 366,286" fill="#062B54" />
    <!-- Stepped Penthouse Crown -->
    <polygon points="372,134 382,124 394,132 394,140 372,140" fill="#062B54" />
    <!-- Skyscraper Window Grid (2 Columns x 7 Rows + Side Slits) -->
    <g fill="#FFFFFF">
      <rect x="371" y="142" width="8" height="8" />
      <rect x="382" y="142" width="8" height="8" />
      <rect x="371" y="155" width="8" height="8" />
      <rect x="382" y="155" width="8" height="8" />
      <rect x="371" y="168" width="8" height="8" />
      <rect x="382" y="168" width="8" height="8" />
      <rect x="371" y="181" width="8" height="8" />
      <rect x="382" y="181" width="8" height="8" />
      <rect x="371" y="194" width="8" height="8" />
      <rect x="382" y="194" width="8" height="8" />
      <rect x="371" y="207" width="8" height="8" />
      <rect x="382" y="207" width="8" height="8" />
      <rect x="371" y="220" width="8" height="8" />
      <rect x="382" y="220" width="8" height="8" />
      <rect x="371" y="233" width="8" height="8" />
      <rect x="382" y="233" width="8" height="8" />
      <rect x="371" y="246" width="8" height="8" />
      <rect x="382" y="246" width="8" height="8" />
    </g>

    <!-- Rightmost Mid-Rise Building with 3 Golden Amber Lit Windows (#062B54 & #E69516) -->
    <polygon points="396,214 418,196 438,214 438,298 396,298" fill="#062B54" />
    <path d="M394 215 L418 195 L440 215" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
    <polygon points="396,214 418,196 438,214 438,298 396,298" fill="#062B54" />
    <!-- Left face white windows -->
    <g fill="#FFFFFF">
      <rect x="402" y="218" width="6" height="8" />
      <rect x="410" y="218" width="6" height="8" />
      <rect x="402" y="231" width="6" height="8" />
      <rect x="410" y="231" width="6" height="8" />
      <rect x="402" y="244" width="6" height="8" />
      <rect x="410" y="244" width="6" height="8" />
    </g>
    <!-- Right face 3 Golden Amber Illuminated Windows (#E69516) -->
    <g fill="#E69516">
      <rect x="423" y="218" width="9" height="9" rx="1" />
      <rect x="423" y="233" width="9" height="9" rx="1" />
      <rect x="423" y="248" width="9" height="9" rx="1" />
    </g>

    <!-- Foreground Urban Leaf Green Tree (#538D22) with White Halo Outline -->
    <path d="M352 260 C340 260 332 252 334 242 C328 236 330 224 338 220 C338 210 348 204 358 206 C366 200 378 204 382 214 C390 218 392 230 386 238 C390 248 382 258 370 258 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    <path d="M352 258 C341 258 334 250 336 241 C330 235 332 225 340 221 C340 212 349 206 358 208 C365 202 376 206 380 215 C388 219 389 230 384 237 C387 246 380 256 369 256 Z" fill="#538D22" />
    <path d="M362 280 L362 248 M362 258 L353 249 M362 255 L371 247" stroke="#062B54" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- 3. OUTER CIRCULAR DEEP NAVY ARCH (#062B54) -->
  <path d="M84 294 A 198 198 0 1 1 428 294 L 419 299 A 188 188 0 1 0 93 299 Z" fill="#062B54" />

  <!-- 4. SWEEPING LEAF GREEN HORIZON ARCS (#538D22) -->
  <g id="leaf-green-horizon">
    <!-- White separation mask above horizon -->
    <path d="M56 328 Q 256 218 456 328 L 456 350 Q 256 244 56 350 Z" fill="#FFFFFF" />
    <!-- Primary Upper Leaf Green Horizon Band -->
    <path d="M52 332 Q 165 268 232 264 L 232 282 Q 158 286 52 332 Z" fill="#538D22" />
    <path d="M460 332 Q 347 268 280 264 L 280 282 Q 354 286 460 332 Z" fill="#538D22" />
    <!-- Lower Inner Leaf Green Arc Legs -->
    <path d="M98 308 Q 112 326 124 342 L 116 342 Q 104 326 91 312 Z" fill="#538D22" />
    <path d="M414 308 Q 400 326 388 342 L 396 342 Q 408 326 421 312 Z" fill="#538D22" />
  </g>

  <!-- 5. THREE CELEBRATORY LEAPING FIGURES (Leaf Green #538D22, Deep Navy #062B54, Golden Amber #E69516) -->
  <g id="three-leaping-figures">
    <!-- Left Figure: Leaf Green (#538D22) -->
    <circle cx="195" cy="147" r="16.5" fill="#538D22" />
    <path d="M148 151 C 172 162 188 175 198 182 C 206 172 214 156 222 136 C 221 174 214 214 196 250 C 194 214 182 184 148 151 Z" fill="#538D22" />

    <!-- Right Figure: Golden Amber (#E69516) -->
    <circle cx="313" cy="144" r="15.5" fill="#E69516" />
    <path d="M291 140 C 299 158 306 170 315 176 C 326 168 342 156 362 146 C 334 176 318 206 306 238 C 290 228 272 232 256 236 C 278 214 292 182 291 140 Z" fill="#E69516" />

    <!-- Center Tallest Figure: Deep Navy (#062B54) -->
    <circle cx="255" cy="95" r="24" fill="#062B54" />
    <path d="M174 82 C 208 104 234 126 255 138 C 276 126 302 104 336 82 C 304 122 285 154 276 192 C 268 220 250 236 224 246 C 240 218 242 186 234 156 C 222 128 202 106 174 82 Z" fill="#062B54" />
  </g>

  <!-- 6. CENTERPIECE: 3D SPRINGBOARD PLATFORM & 4-COIL STEEL SPRING (#062B54 & #FFFFFF) -->
  <g id="springboard-and-coil">
    <!-- 4-Coil Helical Steel Spring underneath the board -->
    <g id="steel-coil-spring">
      <!-- White protective backing behind spring coils -->
      <rect x="220" y="282" width="70" height="72" rx="6" fill="#FFFFFF" />
      <!-- Back descending coil segments (Navy with white outline) -->
      <path d="M268 286 L282 294 M228 300 L282 314 M228 320 L282 334 M228 340 L278 350" stroke="#062B54" stroke-width="7.5" stroke-linecap="round" />
      <path d="M268 286 L282 294 M228 300 L282 314 M228 320 L282 334 M228 340 L278 350" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.95" />
      <path d="M268 286 L282 294 M228 300 L282 314 M228 320 L282 334 M228 340 L278 350" stroke="#062B54" stroke-width="6.5" stroke-linecap="round" />

      <!-- Front ascending coil segments (Overlapping with crisp white edge separation) -->
      <path d="M230 288 C 244 294 268 294 282 294" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none" />
      <path d="M230 288 C 244 294 268 294 282 294" stroke="#062B54" stroke-width="7" stroke-linecap="round" fill="none" />

      <path d="M282 294 C 266 302 242 302 228 302 C 242 310 268 312 282 314" stroke="#FFFFFF" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M282 294 C 266 302 242 302 228 302 C 242 310 268 312 282 314" stroke="#062B54" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <path d="M282 314 C 266 322 242 322 228 322 C 242 330 268 332 282 334" stroke="#FFFFFF" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M282 314 C 266 322 242 322 228 322 C 242 330 268 332 282 334" stroke="#062B54" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <path d="M282 334 C 266 342 242 342 228 342 C 242 350 266 352 282 352 L 228 352" stroke="#FFFFFF" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M282 334 C 266 342 242 342 228 342 C 242 350 266 352 282 352 L 228 352" stroke="#062B54" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- 3D Isometric Springboard Platform (#062B54 with #FFFFFF trim) -->
    <!-- Outer White Halo for Crisp Separation against Horizon -->
    <polygon points="172,262 272,238 344,242 344,264 264,294 172,286" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
    <!-- Top Deck Surface (Deep Navy) -->
    <polygon points="175,263 272,240 341,244 263,270" fill="#062B54" />
    <!-- Front-Left Bevel Face (Deep Navy) -->
    <polygon points="175,266 261,273 261,291 175,284" fill="#062B54" />
    <!-- Right Perspective Side Face (Deep Navy) -->
    <polygon points="265,273 341,247 341,262 265,291" fill="#062B54" />
    <!-- Crisp White 3D Edge Highlights -->
    <polyline points="175,264 263,271 341,245" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="263" y1="271" x2="263" y2="291" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  </g>
</svg>
