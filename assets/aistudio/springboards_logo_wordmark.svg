<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Springboards for Community Development Wordmark">
  <title>Springboards for Community Development — Empower, Elevate, Build, Together</title>
  <!-- 1. PRIMARY WORDMARK: SPRING (#062B54) + BOARDS (#538D22) with Coiled-Spring 'O' -->
  <g id="wordmark-springboards" transform="translate(0, 8)">
    <!-- SPRING in bold condensed Deep Navy (#062B54) -->
    <text x="48" y="88" fill="#062B54" font-family="'Plus Jakarta Sans', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif" font-size="94" font-weight="800" letter-spacing="1" textLength="295" lengthAdjust="spacingAndGlyphs">SPRING</text>

    <!-- B in Leaf Green (#538D22) -->
    <text x="348" y="88" fill="#538D22" font-family="'Plus Jakarta Sans', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif" font-size="94" font-weight="800">B</text>

    <!-- Custom 'O' with 5-Loop Vertical Coiled Spring in Counter -->
    <g id="spring-letter-o" transform="translate(410, 18)">
      <!-- Outer Leaf Green Capsule of 'O' -->
      <rect x="2" y="2" width="48" height="70" rx="22" fill="#538D22" />
      <!-- Inner Counter Cutout with White Coiled Spring -->
      <rect x="13" y="12" width="26" height="50" rx="11" fill="#538D22" />
      <!-- 5-Loop Vertical White Coiled Spring (#FFFFFF) -->
      <path d="M18 16 H34 M18 22 C18 18, 34 18, 34 22 C34 26, 18 25, 18 29 C18 33, 34 32, 34 36 C34 40, 18 39, 18 43 C18 47, 34 46, 34 50 C34 54, 18 53, 18 57 H34" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- ARDS in Leaf Green (#538D22) -->
    <text x="464" y="88" fill="#538D22" font-family="'Plus Jakarta Sans', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif" font-size="94" font-weight="800" letter-spacing="1" textLength="208" lengthAdjust="spacingAndGlyphs">ARDS</text>
  </g>

  <!-- 2. CONNECTOR ROW: ——— FOR ——— (#062B54) -->
  <g id="wordmark-for-row" transform="translate(0, 118)">
    <line x1="66" y1="8" x2="296" y2="8" stroke="#062B54" stroke-width="4" stroke-linecap="round" />
    <text x="360" y="17" fill="#062B54" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" letter-spacing="8" text-anchor="middle">FOR</text>
    <line x1="424" y1="8" x2="654" y2="8" stroke="#062B54" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 3. SUBTITLE: COMMUNITY DEVELOPMENT (#062B54) -->
  <text x="360" y="168" fill="#062B54" font-family="'Plus Jakarta Sans', sans-serif" font-size="29" font-weight="700" letter-spacing="5.5" text-anchor="middle">COMMUNITY DEVELOPMENT</text>

  <!-- 4. PILLARS TAGLINE: EMPOWER • ELEVATE • BUILD • TOGETHER (#538D22 & #E69516) -->
  <g id="wordmark-pillars" transform="translate(360, 200)" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="700" letter-spacing="3.2">
    <text x="-198" y="0" fill="#538D22">EMPOWER</text>
    <circle cx="-116" cy="-6" r="4" fill="#E69516" />
    <text x="-44" y="0" fill="#538D22">ELEVATE</text>
    <circle cx="28" cy="-6" r="4" fill="#E69516" />
    <text x="82" y="0" fill="#538D22">BUILD</text>
    <circle cx="136" cy="-6" r="4" fill="#E69516" />
    <text x="218" y="0" fill="#538D22">TOGETHER</text>
  </g>
</svg>
