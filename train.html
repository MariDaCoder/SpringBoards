  <body class="is-train-page">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main class="prequal-shell" id="main-content" tabindex="-1">
      <a class="prequal-back-link" href="/#our-programs">← Back to programs</a>
      <section class="prequal-content prequal-screen" id="screenIntroDeck" aria-labelledby="prequalTitle">
        <p class="section-eyebrow">TRANSITIONAL JOBS</p>
        <h1 class="prequal-heading" id="prequalTitle">Your next step starts here.</h1>
        <p class="prequal-intro-copy">Watch this short introduction before starting pre-qualification.</p>

        <div class="prequal-deck-container">
          <div class="prequal-slide-frame">
            <button class="prequal-slide-toggle" id="prequalSlideToggle" type="button" data-playing="false" aria-label="Play introduction" aria-pressed="false">
              <img
                class="prequal-slide"
                id="prequalSlide"
                src="/slides/slide-1.svg"
                alt="Transitional Jobs introduction, slide 1 of 10"
                width="1707"
                height="960"
                fetchpriority="high"
              >
              <span class="prequal-slide-control prequal-play-control" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
              </span>
              <span class="prequal-slide-control prequal-pause-control" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"></path></svg>
              </span>
            </button>
          </div>

          <div class="prequal-actions" aria-live="polite">
            <button class="prequal-yes" id="btnStartWizardFromDeck" type="button">Yes: Get Pre Qualified!</button>
            <a class="prequal-no" id="btnDeckNotReady" href="/#our-programs">No: Not Ready Yet.</a>
          </div>
          <nav class="prequal-footer-links" aria-label="Orientation quick links">

        </div>
      </section>
    </main>

    <script src="/analytics.js" defer></script>
    <script>
      (() => {
        const slide = document.getElementById("prequalSlide");
        const slideToggle = document.getElementById("prequalSlideToggle");
        const startWizardBtn = document.getElementById("btnStartWizardFromDeck");

        if (!slide || !slideToggle || !startWizardBtn) return;

        const slides = Array.from({ length: 10 }, (_, index) => `/slides/slide-${index + 1}.svg`);
        slides.slice(1).forEach((src) => {
          const image = new Image();
          image.src = src;
        });

        let currentSlide = 0;
        let playbackTimer = null;
        let isPlaying = false;

        const updatePlaybackControl = () => {
          slideToggle.dataset.playing = String(isPlaying);
          slideToggle.setAttribute("aria-pressed", String(isPlaying));
          slideToggle.setAttribute("aria-label", isPlaying ? "Pause introduction" : "Play introduction");
        };

        const stopPlayback = () => {
          isPlaying = false;
          if (playbackTimer !== null) {
            window.clearTimeout(playbackTimer);
            playbackTimer = null;
          }
          updatePlaybackControl();
        };

        const advanceIntro = () => {
          playbackTimer = null;
          if (!isPlaying) return;
          if (currentSlide === slides.length - 1) {
            stopPlayback();
            return;
          }

          currentSlide += 1;
          slide.src = slides[currentSlide];
          slide.alt = `Transitional Jobs introduction, slide ${currentSlide + 1} of ${slides.length}`;
          playbackTimer = window.setTimeout(advanceIntro, 3000);
        };

        const startPlayback = () => {
          if (currentSlide === slides.length - 1) {
            currentSlide = 0;
            slide.src = slides[currentSlide];
          }
          isPlaying = true;
          updatePlaybackControl();
          playbackTimer = window.setTimeout(advanceIntro, 3000);
        };

        slideToggle.addEventListener("click", () => {
          if (isPlaying) {
            stopPlayback();
          } else {
            startPlayback();
          }
        });

        startWizardBtn.addEventListener("click", () => {
          stopPlayback();
          window.location.assign("/eligibility");
        });
      })();
    </script>
