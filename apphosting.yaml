# Firebase App Hosting Configuration — Springboards Repository (springboards)
# Reference: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # 1. Runtime & Canonical Application URL
  # CRITICAL: NODE_ENV is restricted to RUNTIME only so `npm ci` installs devDependencies during BUILD.
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: APP_URL
    value: https://springboardsfcd.org
    availability:
      - BUILD
      - RUNTIME

  # 2. Firebase Project, Web App & Enterprise Firestore Database Configuration
  - variable: FIREBASE_PROJECT_ID
    value: springboards-community-dev
    availability:
      - BUILD
      - RUNTIME
  - variable: GCLOUD_PROJECT
    value: springboards-community-dev
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_NUMBER
    value: "651964189612"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_MESSAGING_SENDER_ID
    value: "651964189612"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_APP_ID
    value: "1:651964189612:web:fc444ee616bf91da99c809"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_API_KEY
    value: AIzaSyCZbXdTnbIlmFc6Jm0AYt9scNYJFqGOyB8
    availability:
      - BUILD
      - RUNTIME
